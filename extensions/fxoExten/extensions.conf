
[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
CONSOLE=Console/dsp
IAXINFO=guest
TRUNK=DAHDI/G2
TRUNKMSD=1

[from-pstn]
exten => 10000,1,Answer()
  same => n,Playback(hello-world)
  same => n,Hangup()

exten => 501,1,NoOp()
  same => n,Answer()
  same => n,MixMonitor(/home/fxopbx/kevin/pbxSetExe/record/${STRFTIME(${EPOCH},,%y%m%d_%H%M%S)}_${EXTEN}_${CALLERID(num)}.gsm,b)
  same => n,Dial(DAHDI/G1/*0970281871)
  same => n,Hangup()

exten => 502,1,NoOp()
  same => n,Answer()
  same => n,MixMonitor(/home/fxopbx/kevin/pbxSetExe/record/${STRFTIME(${EPOCH},,%y%m%d_%H%M%S)}_${EXTEN}_${CALLERID(num)}.gsm,b)
  same => n,Dial(DAHDI/G1/0920182966)
  same => n,Hangup()

exten => _*9.,1,NoOp()
  same => n,Answer()
  same => n,MixMonitor(/home/fxopbx/kevin/pbxSetExe/record/${STRFTIME(${EPOCH},,%y%m%d_%H%M%S)}_${EXTEN:2}_${CALLERID(num)}.gsm,b)
  same => n,Dial(DAHDI/G1/${EXTEN:2})
  same => n,Hangup()

